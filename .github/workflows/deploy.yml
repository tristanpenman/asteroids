name: Deploy GitHub Pages

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify latest published release
        id: latest-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == false)] | first | .tag_name')"

          if [ "${latest_tag}" = "${RELEASE_TAG}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping deploy for ${RELEASE_TAG}; latest published release is ${latest_tag}."
          fi

      - name: Check out release tag
        if: steps.latest-release.outputs.deploy == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Emscripten
        if: steps.latest-release.outputs.deploy == 'true'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache

      - name: Configure
        if: steps.latest-release.outputs.deploy == 'true'
        run: emcmake cmake -S . -B embuild -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.latest-release.outputs.deploy == 'true'
        run: cmake --build embuild --parallel

      - name: Stage web build
        if: steps.latest-release.outputs.deploy == 'true'
        run: |
          cmake -E make_directory public
          cmake -E copy \
            embuild/index.html \
            embuild/asteroids.js \
            embuild/asteroids.wasm \
            embuild/asteroids.data \
            public

      - name: Deploy to gh-pages
        if: steps.latest-release.outputs.deploy == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
