<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Asteroids</title>
  <style>
    html {
      height: 100%;
    }

    body {
      background: #333;
      font-family: arial;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .emscripten {
      display: block;
      margin-left: auto;
      margin-right: auto;
      padding-right: 0;
    }

    div.emscripten {
      text-align: center;
    }

    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten {
      background-color: #333;
      border: 0px none;
      height: 100%;
      width: 100%;
    }

    @-webkit-keyframes rotation {
      from {-webkit-transform: rotate(0deg);}
      to {-webkit-transform: rotate(360deg);}
    }
    @-moz-keyframes rotation {
      from {-moz-transform: rotate(0deg);}
      to {-moz-transform: rotate(360deg);}
    }
    @-o-keyframes rotation {
      from {-o-transform: rotate(0deg);}
      to {-o-transform: rotate(360deg);}
    }
    @keyframes rotation {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }

    #status {
      color: white;
      font-weight: bold;
      margin: 45px auto;
      position: fixed;
      vertical-align: top;
      width: 100%;
    }

    #progress {
      height: 20px;
      width: 30px;
    }

    #controls {
      background: none;
      display: block;
      margin-top: 30px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="emscripten" id="status">Downloading...</div>
  <div class="emscripten">
    <progress id="progress" max="100" value="0" hidden></progress>
  </div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    const statusElement = document.getElementById('status');
    const progressElement = document.getElementById('progress');
    const canvasElement = document.getElementById('canvas');

    canvasElement.addEventListener('webglcontextlost', function(event) {
      event.preventDefault();
      Module.setStatus('WebGL context lost. Reload the page to continue.');
    });

    var Module = {
      preRun: [],
      postRun: [],

      print: (function() {
        const element = document.getElementById('output');
        if (element) {
          element.value = ''; // clear browser cache
        }

        return function(text) {
          if (arguments.length > 1) {
            text = Array.prototype.slice.call(arguments).join(' ');
          }

          console.log(text);

          if (element) {
            element.value += text + "\n";
            element.scrollTop = element.scrollHeight; // focus on bottom
          }
        };
      })(),

      printErr: function(text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(' ');
        }

        console.error(text);
      },

      canvas: canvasElement,

      setStatus: function(text) {
        if (!Module.setStatus.last) {
          Module.setStatus.last = {
            time: Date.now(),
            text: ''
          }
        }

        if (text === Module.setStatus.last.text) {
          return;
        }

        const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        const now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) {
          return; // if this is a progress update, skip it if too soon
        }

        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;

        if (m) {
          text = m[1];
          progressElement.value = parseFloat(m[2]) * 100;
          progressElement.max = parseFloat(m[4]) * 100;
          progressElement.hidden = false;
        } else {
          progressElement.hidden = true;
        }
        statusElement.textContent = text;
      },

      totalDependencies: 0,

      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          Module.setStatus('Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')');
        } else {
          Module.setStatus('All downloads complete.');
        }
      }
    };

    Module.setStatus('Downloading...');

    window.onerror = function(event) {
      // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) {
          Module.printErr('[post-exception status] ' + text);
        }
      };
    };

  </script>
  <script async src="asteroids.js"></script>
</body>
</html>
