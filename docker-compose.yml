# Docker Compose configuration for building the Emscripten/web version of
# Asteroids without installing the Emscripten SDK locally.

services:
  emscripten:
    # emscripten/emsdk is published for linux/amd64 only; runs under
    # emulation on Apple Silicon.
    platform: linux/amd64
    image: emscripten/emsdk:3.1.51
    working_dir: ${PWD}
    volumes:
      - .:${PWD}

  n64:
    build:
      context: .
      dockerfile: Dockerfile.n64
    platform: linux/amd64
    volumes:
      - .:/source
